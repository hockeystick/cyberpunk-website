<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="#0a0e27"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid-screenshot" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#00ffff" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#grid-screenshot)"/>

  <!-- Header bar -->
  <rect width="1200" height="80" fill="rgba(10, 14, 39, 0.95)"/>
  <rect y="80" width="1200" height="1" fill="#2a2e47"/>

  <!-- Logo -->
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e0e0e0">
    CYBER<tspan fill="#00ffff">PUNK</tspan>
  </text>

  <!-- Navigation -->
  <text x="900" y="50" font-family="Arial, sans-serif" font-size="16" fill="#e0e0e0">Home</text>
  <text x="980" y="50" font-family="Arial, sans-serif" font-size="16" fill="#e0e0e0">About</text>
  <text x="1060" y="50" font-family="Arial, sans-serif" font-size="16" fill="#e0e0e0">Services</text>

  <!-- Hero Section -->
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#00ffff" text-anchor="middle">
    Welcome to the
  </text>
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#00ffff" text-anchor="middle">
    Digital Frontier
  </text>

  <!-- Glow effects -->
  <defs>
    <filter id="glow-screenshot">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Feature boxes -->
  <rect x="100" y="500" width="300" height="200" fill="rgba(26, 30, 55, 0.8)" rx="4"/>
  <rect x="450" y="500" width="300" height="200" fill="rgba(26, 30, 55, 0.8)" rx="4"/>
  <rect x="800" y="500" width="300" height="200" fill="rgba(26, 30, 55, 0.8)" rx="4"/>

  <!-- Feature icons -->
  <circle cx="250" cy="560" r="30" fill="none" stroke="#00ffff" stroke-width="2"/>
  <circle cx="600" cy="560" r="30" fill="none" stroke="#ff00ff" stroke-width="2"/>
  <circle cx="950" cy="560" r="30" fill="none" stroke="#ffff00" stroke-width="2"/>

  <!-- Feature titles -->
  <text x="250" y="630" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#00ffff" text-anchor="middle">
    Real-Time
  </text>
  <text x="600" y="630" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ff00ff" text-anchor="middle">
    Neural Network
  </text>
  <text x="950" y="630" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffff00" text-anchor="middle">
    Quantum Security
  </text>

  <!-- Decorative lines -->
  <line x1="100" y1="450" x2="1100" y2="450" stroke="#00ffff" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="750" x2="1100" y2="750" stroke="#00ffff" stroke-width="1" opacity="0.3"/>

  <!-- Footer -->
  <rect y="820" width="1200" height="80" fill="rgba(5, 8, 18, 0.95)"/>
  <text x="600" y="860" font-family="Arial, sans-serif" font-size="14" fill="#a0a0a0" text-anchor="middle">
    © 2025 Cyberpunk Industries. All rights reserved.
  </text>
</svg>
