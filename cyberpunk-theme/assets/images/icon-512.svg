<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0e27"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid512" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#grid512)"/>

  <!-- Main icon -->
  <text x="256" y="320" font-family="Arial, sans-serif" font-size="192" font-weight="bold"
        fill="#00ffff" text-anchor="middle">CP</text>

  <!-- Glow effect -->
  <defs>
    <filter id="glow512">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="256" y="320" font-family="Arial, sans-serif" font-size="192" font-weight="bold"
        fill="#00ffff" text-anchor="middle" filter="url(#glow512)">CP</text>
</svg>
